:root[data-theme=&quot;light&quot;] {

    --background,

  text-decoration: none;
  text-underline-offset: 2px;

a:is(:hover, :focus-visible) {

  text-decoration-style: dashed;

h2,
h3,
h4,
h5,
h6,

  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {

  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {

}

  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;

}

.table-responsive {
  width: 100%;
  overflow-x: auto;

}

  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {

  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {

}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

}

.table.table-sm :is(th, td):not(:last-child) {

}

.table :is(.text-center, [align=&quot;center&quot;]) {

}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);

.text-muted {

}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;

.btn,

.btn {

  min-height: 28px;
  align-items: center;

a.btn {

  text-decoration: none;
}

.btn:not(:disabled):hover {

.btn-primary {

  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

  opacity: 0.4;

.form-label {

  margin-bottom: 6px;
  color: var(--foreground);
}

  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);

  padding: 8px 10px;

.form-control:focus-visible {

.form-control:disabled,

  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;script&gt;
  (() =&gt; {
    const root = document.getElementById(&#x27;kimiflow-graph-020&#x27;);
    const buttons = Array.from(root.querySelectorAll(&#x27;[data-view]&#x27;));
    const nodes = Array.from(root.querySelectorAll(&#x27;[data-node]&#x27;));
    const mobileNodes = Array.from(root.querySelectorAll(&#x27;[data-mobile-node]&#x27;));
    const edges = Array.from(root.querySelectorAll(&#x27;[data-edge]&#x27;));
    const detailLabel = root.querySelector(&#x27;#kfg-detail-label&#x27;);

    const desc = root.querySelector(&#x27;#kfg-desc&#x27;);

    const phaseNodes = [&#x27;controller&#x27;, &#x27;p0&#x27;, &#x27;p1&#x27;, &#x27;p2&#x27;, &#x27;p3&#x27;, &#x27;p4&#x27;, &#x27;p5&#x27;, &#x27;p6&#x27;, &#x27;p7&#x27;];
    const sequenceEdges = [&#x27;e01&#x27;, &#x27;e12&#x27;, &#x27;e23&#x27;, &#x27;e34&#x27;, &#x27;e45&#x27;, &#x27;e56&#x27;, &#x27;e67&#x27;];
    const feedbackEdges = [&#x27;replan-build&#x27;, &#x27;replan-verify&#x27;, &#x27;repair-review&#x27;, &#x27;retry-tests&#x27;];
    const contextEdges = [&#x27;goal&#x27;, &#x27;program&#x27;, &#x27;workspace&#x27;, &#x27;product&#x27;, &#x27;memory&#x27;, &#x27;code&#x27;, &#x27;models&#x27;, &#x27;tests&#x27;, &#x27;outcome-memory&#x27;, &#x27;evidence-controller&#x27;, &#x27;evidence-review&#x27;, &#x27;commit&#x27;, &#x27;publish&#x27;];
    const allNodes = [&#x27;goal&#x27;, &#x27;program&#x27;, &#x27;workspace&#x27;, &#x27;product&#x27;, &#x27;memory&#x27;, &#x27;code&#x27;, &#x27;models&#x27;, &#x27;tests&#x27;, &#x27;evidence&#x27;, &#x27;commit&#x27;, &#x27;release&#x27;, ...phaseNodes];

    const views = {
      all: {
        label: &#x27;Gesamtgraph&#x27;,
        nodes: allNodes,
        edges: [...sequenceEdges, ...feedbackEdges, ...contextEdges],
        focus: [&#x27;controller&#x27;],
        text: &#x27;Kimiflow bespricht zuerst WHAT und WHY, bindet den Plan an aktuellen Code und verlangt ausführbare Evidence. Nur relevante Findings gehen in eine begrenzte Reparaturrunde.&#x27;,
        desc: &#x27;Der Gesamtgraph zeigt das Produktgespräch, die aktuelle Codebasis, gezielte Recherche, acht Phasen, Evidence-Verträge, endliche Reviews und den lokalen Commit.&#x27;
      },
      feature: {
        label: &#x27;Feature&#x27;,
        nodes: [&#x27;goal&#x27;, &#x27;workspace&#x27;, &#x27;product&#x27;, &#x27;memory&#x27;, &#x27;code&#x27;, &#x27;models&#x27;, &#x27;tests&#x27;, &#x27;evidence&#x27;, &#x27;commit&#x27;, ...phaseNodes],
        edges: [...sequenceEdges, ...feedbackEdges, &#x27;goal&#x27;, &#x27;workspace&#x27;, &#x27;product&#x27;, &#x27;memory&#x27;, &#x27;code&#x27;, &#x27;models&#x27;, &#x27;tests&#x27;, &#x27;outcome-memory&#x27;, &#x27;evidence-controller&#x27;, &#x27;evidence-review&#x27;, &#x27;commit&#x27;],
        focus: [&#x27;product&#x27;, &#x27;p2&#x27;, &#x27;p3&#x27;, &#x27;controller&#x27;],
        text: &#x27;Neue Features beginnen mit einem Code-informierten Gespräch über Problem, sichtbaren Erfolg, Optionen und Scope. Erst nach expliziter Scope- und Flow-Bestätigung folgen Recherche, Plan, Build und ausführbare Verifikation.&#x27;,
        desc: &#x27;Der Feature-Teilgraph hebt Produktdialog, aktuelle Codebasis, Recherche-Vergleich, Evidence-Klassen und relevanzbewusstes Review hervor.&#x27;
      },
      bugfix: {
        label: &#x27;Bugfix&#x27;,
        nodes: [&#x27;goal&#x27;, &#x27;workspace&#x27;, &#x27;memory&#x27;, &#x27;tests&#x27;, &#x27;evidence&#x27;, &#x27;commit&#x27;, ...phaseNodes],
        edges: [...sequenceEdges, &#x27;replan-build&#x27;, &#x27;replan-verify&#x27;, &#x27;repair-review&#x27;, &#x27;retry-tests&#x27;, &#x27;goal&#x27;, &#x27;workspace&#x27;, &#x27;memory&#x27;, &#x27;tests&#x27;, &#x27;outcome-memory&#x27;, &#x27;evidence-controller&#x27;, &#x27;evidence-review&#x27;, &#x27;commit&#x27;],
        focus: [&#x27;p5&#x27;, &#x27;p6&#x27;, &#x27;tests&#x27;],
        text: &#x27;Ein Bugfix nutzt denselben Flow schlanker: reproduzieren, Ursache belegen, minimal beheben und Regression ausführen. Nur Findings mit relevantem unterstütztem Pfad gehen zurück in Repair.&#x27;,
        desc: &#x27;Der Bugfix-Teilgraph fokussiert Reproduktion, Red/Green-Evidence, Regression und kurze relevante Reparaturschleifen.&#x27;
      },
      parallel: {
        label: &#x27;Parallel&#x27;,
        nodes: [&#x27;goal&#x27;, &#x27;workspace&#x27;, &#x27;memory&#x27;, &#x27;tests&#x27;, &#x27;evidence&#x27;, &#x27;commit&#x27;, ...phaseNodes],
        edges: [...sequenceEdges, ...feedbackEdges, &#x27;goal&#x27;, &#x27;workspace&#x27;, &#x27;memory&#x27;, &#x27;tests&#x27;, &#x27;evidence-controller&#x27;, &#x27;evidence-review&#x27;, &#x27;commit&#x27;],
        focus: [&#x27;workspace&#x27;, &#x27;p0&#x27;, &#x27;p7&#x27;, &#x27;commit&#x27;],
        text: &#x27;Bei paralleler Arbeit entscheidet das Workspace-Routing vor Phase 0: clean main läuft direkt, ein dirty oder belegtes Primary erhält einen exklusiv geleasten Kimiflow-Worktree; weitere Runs warten geordnet und werden vor Integration revalidiert.&#x27;,
        desc: &#x27;Der Parallel-Teilgraph hebt sichere Leases, Abhängigkeiten, Revalidierung und serialisierte Candidate-first-Integration hervor.&#x27;
      },
      release: {
        label: &#x27;Release&#x27;,
        nodes: [&#x27;goal&#x27;, &#x27;workspace&#x27;, &#x27;tests&#x27;, &#x27;evidence&#x27;, &#x27;commit&#x27;, &#x27;release&#x27;, ...phaseNodes],
        edges: [...sequenceEdges, ...feedbackEdges, &#x27;goal&#x27;, &#x27;workspace&#x27;, &#x27;tests&#x27;, &#x27;evidence-controller&#x27;, &#x27;evidence-review&#x27;, &#x27;commit&#x27;, &#x27;publish&#x27;],
        focus: [&#x27;tests&#x27;, &#x27;p7&#x27;, &#x27;commit&#x27;, &#x27;release&#x27;],
        text: &#x27;Ein Release bindet ausgeführte Checks an den atomaren Commit und veröffentlicht erst nach expliziter Autorisierung reproduzierbare, unveränderliche Artefakte.&#x27;,
        desc: &#x27;Der Release-Teilgraph verbindet den geprüften Phasenzyklus mit atomarem Commit und immutable Veröffentlichung.&#x27;
      }
    };

    function render(name) {
      const state = views[name];
      const activeNodes = new Set(state.nodes);
      const activeEdges = new Set(state.edges);
      const focusNodes = new Set(state.focus);

      nodes.forEach((node) =&gt; {
        node.classList.toggle(&#x27;is-active&#x27;, activeNodes.has(node.dataset.node));
        node.classList.toggle(&#x27;is-focus&#x27;, focusNodes.has(node.dataset.node));
      });
      mobileNodes.forEach((node) =&gt; {
        node.classList.toggle(&#x27;is-active&#x27;, activeNodes.has(node.dataset.mobileNode));
        node.classList.toggle(&#x27;is-focus&#x27;, focusNodes.has(node.dataset.mobileNode));
      });
      edges.forEach((edge) =&gt; edge.classList.toggle(&#x27;is-active&#x27;, activeEdges.has(edge.dataset.edge)));
      buttons.forEach((button) =&gt; {
        const selected = button.dataset.view === name;
        button.setAttribute(&#x27;aria-pressed&#x27;, selected ? &#x27;true&#x27; : &#x27;false&#x27;);
        button.classList.toggle(&#x27;btn-primary&#x27;, selected);
      });
      detailLabel.textContent = state.label;
      detailText.textContent = state.text;
      desc.textContent = state.desc;
    }

    buttons.forEach((button) =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; render(button.dataset.view)));
    render(&#x27;all&#x27;);
  })();

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;

&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
