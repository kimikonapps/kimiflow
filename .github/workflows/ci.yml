name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.9"
          - os: macos-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Test the remaining behavior
        run: python3 -m unittest discover -s tests -v
      - name: Verify generated package and source parity
        run: python3 scripts/build_plugin.py --check
      - name: Check whitespace
        run: git diff --check
