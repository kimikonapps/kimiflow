name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            lane: full
            python: "3.9"
          - os: macos-latest
            lane: portability
            python: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/setup-node@v6
        if: matrix.lane == 'full'
        with:
          node-version: "22.19.0"

      - name: Install tested Pi runtime — hard gate
        if: matrix.lane == 'full'
        run: npm install --global --ignore-scripts --no-audit --no-fund @earendil-works/pi-coding-agent@0.83.0

      - name: Shell syntax (bash -n) — hard gate
        run: |
          for f in hooks/*.sh; do
            echo "checking $f"
            bash -n "$f"
          done

      - name: Test plan (${{ matrix.lane }}) — hard gate
        run: bash hooks/ci-test-plan.sh run "${{ matrix.lane }}"

      - name: Validate JSON — hard gate
        if: matrix.lane == 'full'
        run: |
          jq -e . hooks/hooks.json > /dev/null
          jq -e . hooks.json > /dev/null
          jq -e . .claude-plugin/plugin.json > /dev/null
          jq -e . .claude-plugin/marketplace.json > /dev/null
          jq -e . .codex-plugin/plugin.json > /dev/null
          jq -e . .agents/plugins/marketplace.json > /dev/null
          jq -e . references/release-profile-v1.schema.json > /dev/null
          jq -e . references/runtime-release-v1.schema.json > /dev/null
          jq -e . references/security-deep-plan-v1.schema.json > /dev/null
          jq -e . references/security-deep-result-v1.schema.json > /dev/null
          jq -e . references/security-eval-v1.schema.json > /dev/null
          jq -e . references/security-promotion-v1.schema.json > /dev/null

      - name: Claude install smoke-test (structural) — hard gate
        if: matrix.lane == 'full'
        run: bash hooks/smoke-install.sh

      - name: Codex install smoke-test (structural) — hard gate
        if: matrix.lane == 'full'
        run: bash hooks/smoke-install-codex.sh

      - name: Deep Security diff evidence (advisory, credential-free)
        if: matrix.lane == 'full'
        continue-on-error: true
        env:
          KIMIFLOW_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          mkdir -p artifacts
          if [ -n "$KIMIFLOW_DIFF_BASE" ] && [ "$KIMIFLOW_DIFF_BASE" != "0000000000000000000000000000000000000000" ]; then
            PYTHONPATH=hooks python3 -m kimiflow_core.runner security ci-artifact --diff . --base "$KIMIFLOW_DIFF_BASE" > artifacts/security-deep-portable.json
          else
            PYTHONPATH=hooks python3 -m kimiflow_core.runner security ci-artifact --diff . > artifacts/security-deep-portable.json
          fi

      - name: Archive Deep Security evidence (advisory)
        if: always() && matrix.lane == 'full'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: security-deep-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/security-deep-portable.json
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: false

      - name: ShellCheck (errors) — hard gate
        if: matrix.lane == 'full'
        run: shellcheck --severity=error hooks/*.sh

      - name: ShellCheck (warnings, informational)
        if: matrix.lane == 'full'
        run: shellcheck --severity=warning hooks/*.sh || true
